name: Review OntoJourney candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/v0.9.2/**'
      - '.github/workflows/review-candidate.yml'

permissions:
  contents: read

jobs:
  tonto-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify validated candidate source
        run: echo '264f7bda66374f36d2cffd2d6227931b771ea0d5463848c44f4d9d74d567ab6c  review/v0.9.2/tonto-project/src/core.tonto' | sha256sum --check
      - name: Local Tonto validation
        run: npx --yes --package=tonto-cli@0.4.13 tonto-cli validate review/v0.9.2/tonto-project
      - name: Generate candidate JSON
        run: npx --yes --package=tonto-cli@0.4.13 tonto-cli generate review/v0.9.2/tonto-project
      - name: Verify generated JSON exists
        run: test -s review/v0.9.2/tonto-project/generated/OntoJourneyCore.json
