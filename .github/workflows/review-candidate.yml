name: Review OntoJourney candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/v0.9.2/**'
      - '.github/workflows/review-candidate.yml'

permissions:
  contents: read

jobs:
  tonto-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify validated candidate source
        run: echo '264f7bda66374f36d2cffd2d6227931b771ea0d5463848c44f4d9d74d567ab6c  review/v0.9.2/tonto-project/src/core.tonto' | sha256sum --check
      - name: Local Tonto validation
        run: npx --yes --package=tonto-cli@0.4.13 tonto-cli validate review/v0.9.2/tonto-project
      - name: Generate candidate JSON
        run: npx --yes --package=tonto-cli@0.4.13 tonto-cli generate review/v0.9.2/tonto-project
      - name: Verify generated JSON exists
        run: test -s review/v0.9.2/tonto-project/generated/OntoJourneyCore.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned validation libraries
        run: pip install -r ontology/reproducible/requirements-validation.txt
      - name: Install local OntoUML library
        run: npm install --prefix review/v0.9.2 --ignore-scripts --no-audit --no-fund ontouml-js@0.4.1
      - name: Verify and transform regenerated JSON
        run: node review/v0.9.2/transform.cjs
      - name: Build and validate candidate RDF and SHACL
        run: |
          set -o pipefail
          python review/v0.9.2/build_and_test.py | tee review/v0.9.2/candidate-output/ci-validation.log
      - name: Hash candidate outputs
        working-directory: review/v0.9.2/candidate-output
        run: sha256sum * > SHA256SUMS
      - name: Upload unpublished candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: ontojourney-v0.9.2-rc-ci
          path: review/v0.9.2/candidate-output/
          if-no-files-found: error
      - name: Assemble and audit full unpublished release preview
        run: python review/v0.9.2/prepare_release_preview.py
      - name: Upload review package (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: ontojourney-v0.9.2-release-preview
          path: |
            review/v0.9.2/release-preview/ontojourney-core-v0.9.2-PREVIEW.zip
            review/v0.9.2/release-preview/SHA256SUMS
          if-no-files-found: error
