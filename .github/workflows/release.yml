name: Publish v0.9.2 release

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: 'Type 0.9.2 to authorize draft release creation'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm_version == '0.9.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ontology/reproducible/requirements-validation.txt
      - name: Install validation dependencies
        run: pip install -r ontology/reproducible/requirements-validation.txt
      - name: Re-run ontology tests
        run: |
          python ontology/reproducible/tests/audit_generated_json.py
          python ontology/reproducible/tests/audit_release_consistency.py
          python ontology/reproducible/tests/run_shacl_tests.py
      - name: Verify frozen release package
        run: python scripts/build_release.py
      - name: Verify versioned release package
        shell: bash
        run: |
          directory="public/artifacts/0.9.2"
          archive="ontojourney-core-v0.9.2.zip"
          test -d "${directory}"
          test -f "${directory}/${archive}"
          (cd "${directory}" && sha256sum --check SHA256SUMS && unzip -t "${archive}")
      - name: Create tag and GitHub release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.9.2 >/dev/null 2>&1; then
            echo "Release v0.9.2 already exists."
            exit 0
          fi
          directory="public/artifacts/0.9.2"
          gh release create v0.9.2 \
            "${directory}/ontojourney-core-v0.9.2.zip" \
            "${directory}/SHA256SUMS" \
            "${directory}/ontojourney-core.ttl" \
            "${directory}/ontojourney-core.rdf" \
            "${directory}/ontojourney-core.jsonld" \
            "${directory}/ontojourney-core.nt" \
            "${directory}/ontojourney-core.shacl.ttl" \
            "${directory}/OntoJourneyCore.json" \
            "${directory}/VALIDATION_REPORT.md" \
            --target "${GITHUB_SHA}" \
            --draft \
            --generate-notes \
            --title "OntoJourney Core 0.9.2"
